name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Commit-lint
        uses: opensource-nepal/commitlint@v1

      - name: Scalafmt
        uses: jrouly/scalafmt-native-action@v4

      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Build
        run: sbt compile

      - name: Test
        run: sbt test

      - name: Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          path: target/test-reports/*.xml
          reporter: java-junit